# Builds the AI assistant skill (skill/build_skill.py) and attaches both zips to a release, so that
# skill/README.md can link to them under releases/latest/download/. Runs when a release is
# published; run it by hand (Actions > Attach the skill to a release) to attach the zips to an
# existing release.
name: Attach the skill to a release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the zips to
        required: true

permissions:
  contents: write

jobs:
  skill:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the skill
        run: |
          pip install pandas openpyxl numpy pypdf pydantic jinja2 pyyaml
          bash skill/test_skill.sh "$RUNNER_TEMP/skill_test"
          python skill/build_skill.py
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" skill/dist/faire-dataset.zip skill/dist/faire-dataset-plugin.zip --clobber
