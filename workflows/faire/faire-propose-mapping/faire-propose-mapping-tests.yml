- doc: A messy water metabarcoding sheet and a methods text with primer sequences
  job:
    sample_table:
      class: File
      path: test-data/messy_edna.csv
      filetype: csv
    methods_text:
      class: File
      path: test-data/primer_methods_sequences.txt
      filetype: txt
  outputs:
    crosswalk:
      asserts:
        has_text:
          text: decimalLatitude
    mapping_report:
      asserts:
        has_line_matching:
          expression: "^date_collected\teventDate\tsampleMetadata\taccept\t.*"
    additional_checks_to_make:
      asserts:
        has_line:
          line: "check\tcolumns\trows\twhat_to_do"
    column_profile:
      asserts:
        has_text:
          text: Lat
    primer_candidates:
      asserts:
        has_text:
          text: "18S V4 (Australian Microbiome)"
    review_sheet:
      asserts:
        has_archive_member:
          path: xl/workbook.xml
          asserts:
            has_text:
              text: Crosswalk (details)
