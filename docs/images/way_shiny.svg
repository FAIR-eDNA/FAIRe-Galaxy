<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 264" width="274" height="264" font-family="Helvetica, Arial, sans-serif">
  <!-- Shiny: one of the three cards in the README -->
  <g transform="translate(2,2)">
    <rect width="270" height="260" rx="12" fill="#eaf6ee" stroke="#2e8a4f" stroke-width="2"/>
    <rect width="270" height="54" rx="12" fill="#2e8a4f"/>
    <rect y="40" width="270" height="14" fill="#2e8a4f"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="28" y="14" width="26" height="18" rx="2"/>
      <path d="M 22 38 L 28 32 L 54 32 L 60 38 Z"/>
    </g>
    <text x="150" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Shiny app</text>
    <text x="135" y="84" text-anchor="middle" font-size="14" font-style="italic" fill="#1f6238">On your own computer</text>
    <path d="M 22 116 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="122" font-size="15" fill="#222">Data stay with you</text>
    <path d="M 22 144 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="150" font-size="15" fill="#222">Works offline</text>
    <path d="M 22 172 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="178" font-size="15" fill="#222">Good for a first try</text>
    <text x="135" y="240" text-anchor="middle" font-size="13" fill="#1f6238">Needs R and Python</text>
  </g>
</svg>
