<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="300" rx="14" fill="#ffffff"/>
  <!-- Galaxy -->
  <g transform="translate(20,20)">
    <rect width="270" height="260" rx="12" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2"/>
    <rect width="270" height="54" rx="12" fill="#2c6fb7"/>
    <rect y="40" width="270" height="14" fill="#2c6fb7"/>
    <text x="135" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Galaxy</text>
    <text x="135" y="84" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4f86">In your web browser</text>
    <path d="M 22 116 l 4 4 l 8 -9" fill="none" stroke="#2c6fb7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="122" font-size="15" fill="#222">Nothing to install</text>
    <path d="M 22 144 l 4 4 l 8 -9" fill="none" stroke="#2c6fb7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="150" font-size="15" fill="#222">A record of every step</text>
    <path d="M 22 172 l 4 4 l 8 -9" fill="none" stroke="#2c6fb7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="178" font-size="15" fill="#222">Joins your analysis</text>
    <text x="42" y="198" font-size="15" fill="#222">workflows</text>
    <text x="135" y="240" text-anchor="middle" font-size="13" fill="#1d4f86">Galaxy Australia eDNA Lab</text>
  </g>
  <!-- Shiny -->
  <g transform="translate(315,20)">
    <rect width="270" height="260" rx="12" fill="#eaf6ee" stroke="#2e8a4f" stroke-width="2"/>
    <rect width="270" height="54" rx="12" fill="#2e8a4f"/>
    <rect y="40" width="270" height="14" fill="#2e8a4f"/>
    <text x="135" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Shiny app</text>
    <text x="135" y="84" text-anchor="middle" font-size="14" font-style="italic" fill="#1f6238">On your own computer</text>
    <path d="M 22 116 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="122" font-size="15" fill="#222">Data stay with you</text>
    <path d="M 22 144 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="150" font-size="15" fill="#222">Works offline</text>
    <path d="M 22 172 l 4 4 l 8 -9" fill="none" stroke="#2e8a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="178" font-size="15" fill="#222">Good for a first try</text>
    <text x="135" y="240" text-anchor="middle" font-size="13" fill="#1f6238">Needs R and Python</text>
  </g>
  <!-- AI assistant -->
  <g transform="translate(610,20)">
    <rect width="270" height="260" rx="12" fill="#fbf1e8" stroke="#c46a1b" stroke-width="2"/>
    <rect width="270" height="54" rx="12" fill="#c46a1b"/>
    <rect y="40" width="270" height="14" fill="#c46a1b"/>
    <text x="135" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">AI assistant</text>
    <text x="135" y="84" text-anchor="middle" font-size="14" font-style="italic" fill="#8a4a12">In a chat with Claude, ChatGPT</text>
    <text x="135" y="102" text-anchor="middle" font-size="14" font-style="italic" fill="#8a4a12">or Microsoft 365 Copilot</text>
    <path d="M 22 130 l 4 4 l 8 -9" fill="none" stroke="#c46a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="136" font-size="15" fill="#222">Talks you through</text>
    <text x="42" y="156" font-size="15" fill="#222">each decision</text>
    <path d="M 22 178 l 4 4 l 8 -9" fill="none" stroke="#c46a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="184" font-size="15" fill="#222">Copes with untidy files</text>
    <text x="135" y="240" text-anchor="middle" font-size="13" fill="#8a4a12">Your files go to the AI company</text>
  </g>
</svg>
